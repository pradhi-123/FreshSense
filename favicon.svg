<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#fsGrad)" filter="url(#glow)"/>

  <!-- Orbital Sensing Waves -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Organic Sprout / Leaf Shape -->
  <path d="M64 26 C82 26 96 42 96 62 C96 82 78 94 64 98 C50 94 32 82 32 62 C32 42 46 26 64 26 Z" fill="url(#leafGrad)"/>
  
  <!-- Biological Central Vein & Biosensor Pulse -->
  <path d="M64 34 L64 92" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 54 Q76 46 82 48" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 68 Q52 60 46 62" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

  <!-- Real-time Biosensor Pulse Radar Dot -->
  <circle cx="64" cy="34" r="5" fill="#38BDF8"/>
  <circle cx="64" cy="34" r="9" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
</svg>

